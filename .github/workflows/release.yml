name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_REPO: AnEntrypoint/hyperagent

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x64-linux
            triplet: x64-linux
            ext: tar.gz
            optional: false
            configure: ""
          - os: ubuntu-24.04-arm
            target: arm64-linux
            triplet: arm64-linux
            ext: tar.gz
            optional: false
            configure: ""
          - os: macos-latest
            target: arm64-macos
            triplet: arm64-osx
            ext: tar.gz
            optional: false
            configure: ""
          - os: macos-latest
            target: x64-macos
            triplet: x64-osx
            ext: tar.gz
            optional: false
            configure: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: windows-latest
            target: x64-windows
            triplet: x64-windows-static
            ext: zip
            optional: false
            configure: ""
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "HYPERAGENT_BUILD_VERSION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Prepare the vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-
      - name: Fetch vcpkg at the manifest baseline
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DHYPERAGENT_VERSION="$HYPERAGENT_BUILD_VERSION"
          ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}
      - name: Airc parity
        if: runner.os != 'Windows'
        run: bash airc/tests/e2e.sh
        env:
          CCBRIDGE_BIN: ${{ github.workspace }}/build/ccbridge
      - name: Install into the shipped layout
        run: |
          layout="$RUNNER_TEMP/layout/hyperagent-${{ matrix.target }}"
          cmake --install build --config Release --prefix "$layout"
          echo "LAYOUT=$layout" >> "$GITHUB_ENV"
      - name: Ship witness
        run: node tools/portable-setup-witness.cjs build
        env:
          HYPERAGENT_WITNESS_DIR: ${{ runner.temp }}
      - name: Package
        run: |
          mkdir -p dist
          archive="hyperagent-${{ matrix.target }}.${{ matrix.ext }}"
          binary="$LAYOUT/bin/hyperagent"
          [ -e "$binary.exe" ] && binary="$binary.exe"
          if [ "${{ matrix.ext }}" = zip ]; then
            (cd "$RUNNER_TEMP/layout" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$archive" "hyperagent-${{ matrix.target }}")
          else
            tar -C "$RUNNER_TEMP/layout" -czf "dist/$archive" "hyperagent-${{ matrix.target }}"
          fi
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi) > "dist/$archive.sha256"
          "$binary" --version
      - uses: actions/upload-artifact@v4
        with:
          name: hyperagent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build]
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.result != 'failure' && github.repository == 'AnEntrypoint/hyperagent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to publish
        id: head
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          probe="$RUNNER_TEMP/latest-tag.sha"
          probe_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$probe" 2> "$probe_err"; then return 0; fi
            if grep -q 'HTTP 404' "$probe_err"; then : > "$probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$probe_err" >&2; exit 1; }
          published=$(cat "$probe")
          published_dir="$RUNNER_TEMP/published"
          mkdir -p "$published_dir"
          if [ "$published" = "$GITHUB_SHA" ] && gh_retry gh release download latest --repo "$RELEASE_REPO" -p manifest.json -p SHA256SUMS -D "$published_dir" --clobber >/dev/null 2>&1; then
            if node tools/release-publication.cjs published-complete "$published_dir/manifest.json" "$published_dir/SHA256SUMS" "$GITHUB_SHA"; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "latest already has a complete manifest for $GITHUB_SHA"
              exit 0
            fi
          fi
          order=new
          if [ -n "$published" ]; then
            order=$(gh_retry gh api "repos/$RELEASE_REPO/compare/$published...$GITHUB_SHA" --jq .status) || { echo "cannot read the release order"; exit 1; }
          fi
          case "$order" in
            ahead | identical | new) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "latest is $published; $GITHUB_SHA is $order to it and is not published"
              ;;
          esac
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          pattern: hyperagent-*
          path: dist
          merge-multiple: true
      - name: Verify all five build artifacts
        if: steps.head.outputs.current == 'true'
        run: node tools/release-publication.cjs verify-artifacts dist
      - name: Version names, checksums and manifest
        if: steps.head.outputs.current == 'true'
        run: |
          build="${GITHUB_SHA:0:7}-$GITHUB_RUN_NUMBER"
          node tools/release-publication.cjs write-manifest dist release "$build" "$GITHUB_SHA"
          cat release/manifest.json
      - name: Create the release if absent
        if: steps.head.outputs.current == 'true'
        run: |
          gh release view latest --repo "$RELEASE_REPO" >/dev/null 2>&1 || gh release create latest --repo "$RELEASE_REPO" --target "$GITHUB_SHA" --title latest --notes "Latest hyperagent build" --latest
      - name: Upload the assets
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          gh_retry gh release upload latest release/* --repo "$RELEASE_REPO" --clobber
          gh_retry gh release edit latest --repo "$RELEASE_REPO" --latest
      - name: Move the latest tag
        if: steps.head.outputs.current == 'true'
        run: |
          gh_retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "retry $n for $1" >&2; sleep $((n * 5)); done; return 1; }
          tag_probe="$RUNNER_TEMP/latest-tag.sha"
          tag_err="$RUNNER_TEMP/latest-tag.err"
          read_latest_tag() {
            if gh api "repos/$RELEASE_REPO/git/ref/tags/latest" --jq .object.sha > "$tag_probe" 2> "$tag_err"; then return 0; fi
            if grep -q 'HTTP 404' "$tag_err"; then : > "$tag_probe"; return 0; fi
            return 1
          }
          gh_retry read_latest_tag || { echo "cannot read the latest tag ref" >&2; cat "$tag_err" >&2; exit 1; }
          if [ -s "$tag_probe" ]; then
            gh_retry gh api -X PATCH "repos/$RELEASE_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh_retry gh api -X POST "repos/$RELEASE_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
      - name: Prune versioned assets beyond the newest 3 builds
        if: steps.head.outputs.current == 'true'
        run: |
          gh release view latest --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          kept=$(grep -oE '^hyperagent-[0-9a-f]{7}-[0-9]+-' "$RUNNER_TEMP/assets.txt" | sort -u | sort -t- -k3,3nr | head -n 3)
          grep -E '^hyperagent-[0-9a-f]{7}-[0-9]+-' "$RUNNER_TEMP/assets.txt" | while read -r name; do
            prefix=$(grep -oE '^hyperagent-[0-9a-f]{7}-[0-9]+-' <<< "$name")
            grep -qxF "$prefix" <<< "$kept" || gh release delete-asset latest "$name" --repo "$RELEASE_REPO" --yes
          done
