title: "gm: relay of complaints from oscraft, jayzee, fx, spoint (orchestrator, 2026-11-08, cycle 5)"
body: "Reported by peers via the orchestrator, to be resolved by gm:\n1. oscraft: console.log inside run_code does not surface run_shell output (it printed null); only the return value works. The tool description should say so.\n2. oscraft: gm.job_start takes job, not name, and the error does not name the parameter. The description should list the parameters.\n3. oscraft: run_code rejects timeoutMs above 300000 with a clear error, but the description does not state the limit.\n4. jayzee: read_file on docs/IDEAL.md returned an inner truncation marker (truncated at 19969 of 164855 bytes) while the top-level truncated flag stayed false. Make the flag consistent, so a truncated read is never reported as complete.\n5. jayzee: next_context re-delivered already-cleared events, including pending entries for a finished job. Stop re-delivering events that were already cleared.\n6. fx: git_status and git_log run from the project root /workspace/fx, which is not a repository, and fail with exit 128. Make them run from the nested checkout, or accept a cwd argument.\n7. spoint: every finish returned a rulesNotice saying finish was called with no call in its step, even after next_context. The notice asks for a skill read after the run has ended. Make the notice accurate, and deliver it before the finish call."
